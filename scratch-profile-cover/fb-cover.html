<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1640px;
    height: 624px;
    overflow: hidden;
    position: relative;
    background: #FAF8F5;
    font-family: 'Jost', sans-serif;
    color: #0A1C1A;
  }

  /* Left photo pane: The friendly technician selfie in van */
  .left-pane {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 680px;
    overflow: hidden;
    z-index: 1;
  }
  .left-pane img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
  }
  .left-pane-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(10,28,26,0.1) 0%, rgba(10,28,26,0.35) 100%);
  }

  /* Torn brush edge transition */
  .brush-divider {
    position: absolute;
    left: 600px;
    top: -20px;
    bottom: -20px;
    width: 140px;
    z-index: 3;
    pointer-events: none;
    fill: #FAF8F5;
  }

  /* Right content pane */
  .right-pane {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 960px;
    background: #FAF8F5;
    z-index: 2;
    padding: 35px 60px 35px 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dot-texture {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(184, 142, 62, 0.16) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    opacity: 0.7;
    pointer-events: none;
  }

  .brand-section {
    max-width: 460px;
    position: relative;
    z-index: 5;
  }

  .tagline-lead {
    font-family: 'Marcellus', serif;
    font-size: 26px;
    line-height: 1.25;
    color: #0A1C1A;
    margin: 14px 0 16px;
  }
  .tagline-lead em {
    font-style: italic;
    color: #B88E3E;
  }

  .cta-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .btn-book {
    background: linear-gradient(135deg, #FAF1D7 0%, #EBD49A 50%, #D8B467 100%);
    border: 1.5px solid #B88E3E;
    color: #0A1C1A;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(184, 142, 62, 0.28);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .guarantee-tag {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #6C5521;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Services column */
  .services-column {
    background: #FFFFFF;
    border: 1.5px solid rgba(184, 142, 62, 0.3);
    border-radius: 18px;
    padding: 24px 28px;
    width: 360px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    position: relative;
    z-index: 5;
  }
  .services-header {
    font-family: 'Marcellus', serif;
    font-size: 16px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8A6828;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(184, 142, 62, 0.2);
    padding-bottom: 8px;
  }
  .services-header span {
    font-size: 11px;
    color: #4A5B58;
    font-family: 'Jost', sans-serif;
  }

  .svc-item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14.5px;
    font-weight: 600;
    color: #0A1C1A;
    margin-bottom: 10px;
  }
  .svc-item-row:last-child {
    margin-bottom: 0;
  }
  .check-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #0A1C1A;
    color: #D8B467;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
</style>
</head>
