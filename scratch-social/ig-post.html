<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    font-family: 'Jost', sans-serif;
    color: #F7F5F0;
    background: #081413;
  }

  .bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    filter: brightness(0.65);
  }
  .bg-scrim {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(9, 23, 21, 0.85) 0%, rgba(6, 16, 15, 0.96) 100%);
  }

  .gold-border {
    position: absolute;
    inset: 32px;
    border: 1px solid rgba(212, 169, 79, 0.4);
    pointer-events: none;
    z-index: 5;
  }

  .content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 70px 60px;
  }

  .top-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 15px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #E2C27D;
  }
  .top-meta::before, .top-meta::after {
    content: '';
    width: 38px;
    height: 1px;
    background: #E2C27D;
  }

  .center-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .crest {
    width: 100px;
    height: 100px;
    border: 1.5px solid #D8B467;
    transform: rotate(45deg);
    border-radius: 12px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(14, 38, 35, 0.9);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .crest span {
    transform: rotate(-45deg);
    font-family: 'Marcellus', serif;
    font-size: 40px;
    color: #E2C27D;
  }

  .main-heading {
    font-family: 'Marcellus', serif;
    font-size: 78px;
    letter-spacing: 0.03em;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .main-heading em {
    font-style: normal;
    background: linear-gradient(135deg, #FFF6DD 0%, #E2C27D 35%, #B88E3E 70%, #F5E1A4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .ar-heading {
    font-family: 'Amiri', serif;
    font-size: 44px;
    color: #D8B467;
    margin-bottom: 24px;
  }

  .tagline {
    font-family: 'Marcellus', serif;
    font-size: 32px;
    line-height: 1.35;
    color: #F7F5F0;
    max-width: 760px;
    margin-bottom: 24px;
  }
  .tagline em {
    font-style: italic;
    color: #E8CF94;
  }

  .services-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    max-width: 820px;
    margin-bottom: 30px;
  }
  .tag {
    background: rgba(10, 26, 24, 0.8);
    border: 1px solid rgba(212, 169, 79, 0.3);
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    color: #E2C27D;
  }

  .bottom-cta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .cta-btn {
    background: linear-gradient(135deg, #E2C27D 0%, #C5A059 50%, #B38C44 100%);
    color: #0A1C1A;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 16px 48px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(184, 142, 62, 0.35);
  }
  .web-link {
    font-size: 15px;
    letter-spacing: 0.22em;
    color: #A3B8B5;
    text-transform: uppercase;
  }
</style>
</head>
