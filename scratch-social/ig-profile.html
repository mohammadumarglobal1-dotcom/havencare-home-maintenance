<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #153835 0%, #0A1C1A 60%, #040C0B 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    color: #F7F5F0;
    position: relative;
  }

  /* Instagram circular crop safe-zone guide at 960px */
  .gold-ring-1 {
    position: absolute;
    width: 950px;
    height: 950px;
    border-radius: 50%;
    border: 2px solid rgba(216, 180, 103, 0.4);
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }
  .gold-ring-2 {
    position: absolute;
    width: 910px;
    height: 910px;
    border-radius: 50%;
    border: 1px solid rgba(216, 180, 103, 0.2);
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Massive high-contrast luxury monogram for Instagram */
  .emblem-box {
    width: 320px;
    height: 320px;
    border-radius: 44px;
    background: linear-gradient(145deg, #1A423F, #081615);
    border: 2.5px solid #D8B467;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 0 30px rgba(216, 180, 103, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 45px;
  }
  .emblem-box::after {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 34px;
    border: 1px solid rgba(216, 180, 103, 0.35);
  }

  .emblem-letters {
    font-family: 'Marcellus', serif;
    font-size: 165px;
    line-height: 1;
    background: linear-gradient(135deg, #FFF9EA 0%, #E2C27D 35%, #B88E3E 70%, #F5E1A4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5));
  }

  .brand-wordmark {
    font-family: 'Marcellus', serif;
    font-size: 96px;
    letter-spacing: 0.05em;
    color: #F7F5F0;
    line-height: 1;
    margin-bottom: 12px;
  }
  .brand-wordmark em {
    font-style: normal;
    color: #E2C27D;
  }

  .arabic-wordmark {
    font-family: 'Amiri', serif;
    font-size: 48px;
    color: #D8B467;
    margin-bottom: 26px;
  }

  .subtitle {
    font-size: 21px;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: #B88E3E;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="gold-ring-1"></div>
  <div class="gold-ring-2"></div>

  <div class="content">
    <div class="emblem-box">
      <div class="emblem-letters">HC</div>
    </div>
    <div class="brand-wordmark">Haven<em>Care</em></div>
    <div class="arabic-wordmark">ملاذ كير</div>
  </div>
</body>
</html>
