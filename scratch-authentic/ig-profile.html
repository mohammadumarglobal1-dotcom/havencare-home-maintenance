<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    background: #F1E9DC;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #FAF6EE 0%, #F1E9DC 65%, #E5DAC7 100%);
  }

  /* Safe circle border matching Instagram's circular avatar */
  .ig-circle-border {
    position: absolute;
    width: 950px;
    height: 950px;
    border-radius: 50%;
    border: 3px solid rgba(184, 142, 62, 0.45);
    box-shadow: 0 0 60px rgba(184, 142, 62, 0.2);
  }

  .logo-box {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .ig-logo {
    width: 680px;
    height: auto;
    display: block;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.1));
  }
  .ig-subtitle {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #0F1B2A;
    margin-top: 18px;
  }
</style>
